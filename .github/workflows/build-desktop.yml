name: Build Native Desktop Installers & Embedded Fabric Mods

on:
  push:
    branches:
      - "arena/**"
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fabric-mods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle & Fabric Loom dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: winvisual-fabric-loom-${{ hashFiles('mod-fabric/*/build.gradle') }}
          restore-keys: |
            winvisual-fabric-loom-

      - name: Provision Gradle 8.11.1 & Gradle 9.1.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle-8.zip
          curl -fsSL https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -o /tmp/gradle-9.zip
          sudo unzip -q /tmp/gradle-8.zip -d /opt/
          sudo unzip -q /tmp/gradle-9.zip -d /opt/

      - name: Compile WinVisual Fabric Client Mods (1.16.5, 1.21.4)
        run: |
          mkdir -p public/mods
          /opt/gradle-8.11.1/bin/gradle -p mod-fabric/mc-1.16.5 build --no-daemon --stacktrace
          /opt/gradle-8.11.1/bin/gradle -p mod-fabric/mc-1.21.4 build --no-daemon --stacktrace

          cp mod-fabric/mc-1.16.5/build/libs/winvisual-client-1.16.5-2.8.0.jar public/mods/winvisual-client-1.16.5.jar
          cp mod-fabric/mc-1.21.4/build/libs/winvisual-client-1.21.4-2.8.0.jar public/mods/winvisual-client-1.21.4.jar

          python3 - <<'PY'
          import hashlib, zipfile
          for ver, entry_cls in [
              ("1.16.5", "com/winvisual/mc1165/WinVisualMod1165.class"),
              ("1.21.4", "com/winvisual/mc1214/WinVisualMod1214.class"),
          ]:
              p = f"public/mods/winvisual-client-{ver}.jar"
              with zipfile.ZipFile(p, "r") as zf:
                  names = set(zf.namelist())
                  for req in ["fabric.mod.json", "assets/winvisual/icon.png", "com/winvisual/core/WinVisualEngine.class", entry_cls]:
                      assert req in names, f"Missing {req} in {p}: {sorted(names)[:20]}"
              data = open(p, "rb").read()
              print(f"VERIFIED {p}: {len(data)} bytes | sha256={hashlib.sha256(data).hexdigest()}")
          PY

      - name: Upload compiled Fabric client mod jars
        uses: actions/upload-artifact@v4
        with:
          name: winvisual-fabric-mods
          path: public/mods/winvisual-client-*.jar
          if-no-files-found: error

  build-arcanic-12111:
    needs: build-fabric-mods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 25 (Loom 1.18 needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle & Fabric Loom dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: winvisual-arcanic-loom-${{ hashFiles('mod-fabric/arcanic-1.21.11/**/*.gradle', 'mod-fabric/arcanic-1.21.11/gradle.properties') }}
          restore-keys: |
            winvisual-arcanic-loom-

      - name: Build the Arcanic-based 1.21.11 client core
        working-directory: mod-fabric/arcanic-1.21.11
        run: |
          chmod +x gradlew
          ./gradlew build -x spotlessCheck -x spotlessJava --no-daemon --stacktrace

      - name: Publish jar into public/mods
        run: |
          mkdir -p public/mods
          SRC=$(ls mod-fabric/arcanic-1.21.11/build/libs/*.jar | grep -v sources | head -1)
          cp "$SRC" public/mods/winvisual-arcanic-1.21.11.jar
          python3 - <<'PY'
          import hashlib
          p = "public/mods/winvisual-arcanic-1.21.11.jar"
          data = open(p, "rb").read()
          print(f"VERIFIED {p}: {len(data)} bytes | sha256={hashlib.sha256(data).hexdigest()}")
          PY

      - name: Upload the 1.21.11 core jar
        uses: actions/upload-artifact@v4
        with:
          name: winvisual-arcanic-1.21.11
          path: public/mods/winvisual-arcanic-1.21.11.jar
          if-no-files-found: error

  build-tauri:
    needs: [build-fabric-mods, build-arcanic-12111]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled WinVisual Fabric mod jars into public/mods
        uses: actions/download-artifact@v4
        with:
          name: winvisual-fabric-mods
          path: public/mods

      - name: Download the Arcanic-based 1.21.11 core into public/mods
        uses: actions/download-artifact@v4
        with:
          name: winvisual-arcanic-1.21.11
          path: public/mods

      - name: Stage compiled JARs copy on Linux runner
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p /tmp/wv-jars
          cp public/mods/winvisual-client-*.jar public/mods/winvisual-arcanic-*.jar /tmp/wv-jars/

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux WebKitGTK & system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Cache Rust Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies & verify production build
        run: |
          npm ci
          npm run build

      - name: Build Tauri Desktop Installers & Publish Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v2.8.0
          releaseName: "WinVisual Launcher v2.8.0 — 1.16.5 / 1.21.4 / 1.21.11"
          releaseBody: "WinVisual Launcher v2.8.0 — native Tauri v2 installers (Windows .exe / .msi, macOS .dmg, Linux .deb / .rpm / .AppImage). WinVisual 1.21.11 now ships the full Arcanic-based client core (menu, wardrobe, presets, HUD editor, Dynamic Island, target HUD, cosmetics, hit effects) — GPL-3.0, see NOTICE.md. WinVisual 1.16.5 and 1.21.4 keep the shared-core build with the new token-based Studio menu and module inspector. Includes the in-launcher Modrinth browser for mods and resource packs, and the automatic Mojang Java runtime provisioning (Java 21 for 1.21.x)."

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach Linux bundles & compiled Fabric mod JARs + sync JARs to branch
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.8.0 \
            public/mods/winvisual-client-1.16.5.jar \
            public/mods/winvisual-client-1.21.4.jar \
            public/mods/winvisual-arcanic-1.21.11.jar \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber

      - name: Upload compiled Fabric client mod jars
        uses: actions/upload-artifact@v4
        with:
          name: winvisual-fabric-mods
          path: public/mods/winvisual-client-*.jar
          if-no-files-found: error

  build-arcanic-12111:
    needs: build-fabric-mods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 25 (Loom 1.18 needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle & Fabric Loom dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: winvisual-arcanic-loom-${{ hashFiles('mod-fabric/arcanic-1.21.11/**/*.gradle', 'mod-fabric/arcanic-1.21.11/gradle.properties') }}
          restore-keys: |
            winvisual-arcanic-loom-

      - name: Build the Arcanic-based 1.21.11 client core
        working-directory: mod-fabric/arcanic-1.21.11
        run: |
          chmod +x gradlew
          ./gradlew build -x spotlessCheck -x spotlessJava --no-daemon --stacktrace

      - name: Publish jar into public/mods
        run: |
          mkdir -p public/mods
          SRC=$(ls mod-fabric/arcanic-1.21.11/build/libs/*.jar | grep -v sources | head -1)
          cp "$SRC" public/mods/winvisual-arcanic-1.21.11.jar
          python3 - <<'PY'
          import hashlib
          p = "public/mods/winvisual-arcanic-1.21.11.jar"
          data = open(p, "rb").read()
          print(f"VERIFIED {p}: {len(data)} bytes | sha256={hashlib.sha256(data).hexdigest()}")
          PY

      - name: Upload the 1.21.11 core jar
        uses: actions/upload-artifact@v4
        with:
          name: winvisual-arcanic-1.21.11
          path: public/mods/winvisual-arcanic-1.21.11.jar
          if-no-files-found: error

  build-tauri:
    needs: [build-fabric-mods, build-arcanic-12111]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled WinVisual Fabric mod jars into public/mods
        uses: actions/download-artifact@v4
        with:
          name: winvisual-fabric-mods
          path: public/mods

      - name: Download the Arcanic-based 1.21.11 core into public/mods
        uses: actions/download-artifact@v4
        with:
          name: winvisual-arcanic-1.21.11
          path: public/mods

      - name: Stage compiled JARs copy on Linux runner
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p /tmp/wv-jars
          cp public/mods/winvisual-client-*.jar public/mods/winvisual-arcanic-*.jar /tmp/wv-jars/

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux WebKitGTK & system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Cache Rust Cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies & verify production build
        run: |
          npm ci
          npm run build

      - name: Build Tauri Desktop Installers & Publish Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v2.8.0
          releaseName: "WinVisual Launcher v2.8.0 — 1.16.5 / 1.21.4 / 1.21.11"
          releaseBody: "WinVisual Launcher v2.8.0 — native Tauri v2 installers (Windows .exe / .msi, macOS .dmg, Linux .deb / .rpm / .AppImage). WinVisual 1.21.11 now ships the full Arcanic-based client core (menu, wardrobe, presets, HUD editor, Dynamic Island, target HUD, cosmetics, hit effects) — GPL-3.0, see NOTICE.md. WinVisual 1.16.5 and 1.21.4 keep the shared-core build with the new token-based Studio menu and module inspector. Includes the in-launcher Modrinth browser for mods and resource packs, and the automatic Mojang Java runtime provisioning (Java 21 for 1.21.x)."

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach Linux bundles & compiled Fabric mod JARs + sync JARs to branch
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.8.0 \
            public/mods/winvisual-client-1.16.5.jar \
            public/mods/winvisual-client-1.21.4.jar \
            public/mods/winvisual-arcanic-1.21.11.jar \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber

          rm -rf /tmp/wv-sync
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/wv-sync
          cp /tmp/wv-jars/winvisual-client-*.jar /tmp/wv-jars/winvisual-arcanic-*.jar /tmp/wv-sync/public/mods/
          cd /tmp/wv-sync
          git config user.name "WinVisual Builder"
          git config user.email "builder@winvisual.local"
          git add public/mods/winvisual-client-*.jar public/mods/winvisual-arcanic-*.jar
          if git diff --cached --quiet; then
            echo "jars already up to date on the branch"
          else
            git commit -m "chore(mods): embed compiled Fabric bytecode jars for 1.16.5, 1.21.4, 1.21.11 [skip ci]"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              echo "push rejected (attempt $attempt) - rebasing on the remote tip"
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
              sleep 3
            done
          fi
