[package]
name = "winvisual-launcher"
version = "2.7.2"
description = "WinVisual — Premium Minecraft Visual Client Launcher"
authors = ["WinVisual Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["macos-private-api"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "5.0"
sysinfo = "0.32"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
